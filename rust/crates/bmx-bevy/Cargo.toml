[package]
name = "bmx-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
gc-runtime = { path = "../gc-runtime" }
bmx-recomp = { path = "../bmx-recomp" }
cpal = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "29", default-features = false }

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
