[package]
name = "gc-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
gc-core = { path = "../gc-core" }

# Native sampling profiler for the probe (suspend thread, read RIP, symbolize via dbghelp).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader"] }
